<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../options/ui.css">
<style>
  body { width: 380px; margin: 0; padding: 14px; background: var(--bg); color: var(--text); font-size: 12.5px; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .head .logo {
    width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(160deg, #ef4444, #b91c1c);
    box-shadow: 0 2px 10px rgba(239, 68, 68, .35);
  }
  .head h1 { font-size: 15px; margin: 0; font-weight: 800; letter-spacing: -.02em; }
  .head .sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .spacer { flex: 1; }

  .icon-btn {
    background: rgba(255, 255, 255, .06); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px; cursor: pointer; color: var(--muted); display: grid; place-items: center;
    transition: all .15s ease;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, .12); color: #fff; }

  .banner {
    border-radius: 13px; padding: 12px 14px; margin-bottom: 11px;
    display: flex; gap: 11px; align-items: flex-start;
  }
  .banner.locked { background: rgba(239, 68, 68, .12); border: 1px solid rgba(239, 68, 68, .45); }
  .banner.open { background: rgba(16, 185, 129, .10); border: 1px solid rgba(16, 185, 129, .35); }
  .banner.warn { background: rgba(245, 158, 11, .14); border: 1px solid rgba(245, 158, 11, .45); }
  .banner .big { font-size: 13.5px; font-weight: 750; margin-bottom: 2px; }
  .banner .small { font-size: 11px; color: var(--muted); line-height: 1.45; }
  .banner .cd { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 6px; color: #fca5a5; }

  /* Daily Focus Card */
  .focus-card {
    background: rgba(59, 130, 246, .08); border: 1px solid rgba(59, 130, 246, .25);
    border-radius: 11px; padding: 9px 12px; margin-bottom: 11px; display: flex; align-items: center; gap: 9px;
  }
  .focus-icon { font-size: 15px; }
  .focus-text { flex: 1; font-size: 11.5px; color: #bfdbfe; line-height: 1.4; }
  .focus-text b { color: #fff; font-weight: 650; }
  .focus-edit-btn { background: none; border: none; padding: 2px; cursor: pointer; color: var(--muted); font-size: 11px; }
  .focus-edit-btn:hover { color: #fff; }

  /* Bento Stats */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 11px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 9px 8px; }
  .stat .k { font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .stat .v { font-size: 15px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat .lim { font-size: 9.5px; color: var(--dim); margin-top: 1px; }
  .mini-bar { height: 4px; border-radius: 99px; background: rgba(255,255,255,.09); margin-top: 6px; overflow: hidden; }
  .mini-bar > i { display: block; height: 100%; background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444); }

  /* Quick Actions Grid */
  .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 11px; }
  .quick-btn {
    background: rgba(255, 255, 255, .04); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 6px; font-size: 11px; font-weight: 600; color: var(--text); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
    transition: all .15s ease;
  }
  .quick-btn:hover { background: rgba(255, 255, 255, .09); border-color: var(--line-strong); transform: translateY(-1px); }
  .quick-btn .qb-icon { font-size: 15px; }

  /* Quick Log Drawer */
  .log { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px; margin-bottom: 10px; }
  .log .t { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; font-weight: 700; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .fields input { width: 100%; font-size: 12px; padding: 7px 9px; }
  .rowbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 7px; }
  .rowbtns button { padding: 7px; font-size: 12px; }

  .btnrow { display: flex; gap: 7px; }
  .btnrow button { flex: 1; padding: 8px 10px; font-size: 11.5px; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 10.5px; color: var(--dim); }
  .foot a { color: var(--link); cursor: pointer; text-decoration: none; }
  .pos { color: #34d399; } .neg { color: #f87171; }
  .warn { color: #fbbf24; }
</style>
</head>
<body>
  <div class="head">
    <div class="logo">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <rect x="9" y="11" width="6" height="5" rx="1"/>
        <path d="M10 11V9a2 2 0 0 1 4 0v2"/>
      </svg>
    </div>
    <div>
      <h1>Trade Lock</h1>
      <div class="sub" id="date">—</div>
    </div>
    <div class="spacer"></div>
    <div id="planBadge" class="badge free">FREE</div>
    <button id="upgradeHeaderBtn" class="badge" style="cursor:pointer;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;font-weight:750;padding:3px 9px;border-radius:6px;letter-spacing:0.04em;" title="View Pro & Pro+ AI plans">Upgrade ↗</button>
    <button class="icon-btn" id="openSettingsTop" title="Open Settings &amp; Dashboard">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div id="banner" class="banner open">
    <div style="flex:1">
      <div class="big" id="bannerTitle">Trading Active</div>
      <div class="small" id="bannerText">Monitoring order fills against risk rules.</div>
      <div class="cd" id="bannerCd" style="display:none"></div>
    </div>
  </div>

  <!-- Daily Focus Card -->
  <div class="focus-card" id="focusCard">
    <span class="focus-icon">🎯</span>
    <div class="focus-text" id="focusText"><b>Daily Focus:</b> Stick strictly to predefined setups. Never revenge trade.</div>
    <button class="focus-edit-btn" id="focusEditBtn" title="Change daily focus">✎</button>
  </div>

  <div id="coachLine" style="display:none;margin-bottom:10px;font-size:11.5px;line-height:1.5;padding:8px 10px;border-radius:10px;background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.35);color:#fde68a"></div>

  <div class="stats" id="stats"></div>

  <!-- Hero Open Side Panel & Full Dashboard Actions -->
  <div style="display:flex;gap:7px;margin-bottom:11px;">
    <button id="openSidePanelBtn" class="primary" style="flex:1;padding:8px 6px;font-size:11px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:5px;background:linear-gradient(135deg,#059669,#10b981);border:none;border-radius:9px;color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(16,185,129,0.3);transition:all .15s ease;" title="Open Market, OI & Journal right beside your broker without a new tab">
      <span>◨ Side Panel</span>
    </button>
    <button id="openDashboardHero" class="ghost" style="flex:1;padding:8px 6px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;background:rgba(37,99,235,0.18);border:1px solid rgba(59,130,246,0.35);border-radius:9px;color:#93c5fd;cursor:pointer;transition:all .15s ease;" title="Open full-screen expanded dashboard in a new tab">
      <span>⚡ Full Tab ↗</span>
    </button>
  </div>

  <!-- Quick Actions Grid -->
  <div class="quick-grid">
    <button class="quick-btn" id="qaCharts">
      <span class="qb-icon">📈</span>
      <span>Charts</span>
    </button>
    <button class="quick-btn" id="qaOptions">
      <span class="qb-icon">⚡</span>
      <span>Options</span>
    </button>
    <button class="quick-btn" id="qaAddTrade">
      <span class="qb-icon">➕</span>
      <span>Add Trade</span>
    </button>
    <button class="quick-btn" id="qaAi">
      <span class="qb-icon">🤖</span>
      <span>Ask AI</span>
    </button>
    <button class="quick-btn" id="qaJournal">
      <span class="qb-icon">📓</span>
      <span>Journal</span>
    </button>
    <button class="quick-btn" id="qaRules">
      <span class="qb-icon">🛡️</span>
      <span>Rules</span>
    </button>
  </div>

  <!-- Manual Trade Quick Logger Drawer -->
  <div class="log" id="logDrawer">
    <div class="t">Log Closed Trade (Manual / Mobile)</div>
    <div class="fields">
      <input id="pnl" type="number" step="0.01" placeholder="P&amp;L ₹ (use - for loss)">
      <input id="risk" type="number" step="0.01" placeholder="Risk ₹ (defaults to plan)">
    </div>
    <div class="rowbtns">
      <button class="primary" id="addWin" style="background:#10b981">Log win</button>
      <button class="danger" id="addLoss">Log loss</button>
    </div>
  </div>

  <div class="btnrow">
    <button id="lockNow" class="danger">Lock screen now</button>
    <button id="undo" class="ghost">Undo last</button>
  </div>
  <div class="btnrow" style="margin-top:6px">
    <button id="openOptions" class="ghost">Dashboard &amp; Settings</button>
    <button id="viewPlansBtn" class="ghost" style="color:#a78bfa;font-weight:700">★ Plans &amp; Pricing</button>
  </div>

  <div class="foot">
    <span id="footnote">—</span>
    <a id="openOptions2">rules</a>
  </div>

<script src="../lib/rules.js"></script>
<script src="../lib/insights.js"></script>
<script src="popup.js"></script>
</body>
</html>
