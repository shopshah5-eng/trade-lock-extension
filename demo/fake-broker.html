<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fake Broker — Order Book (Trade Lock test fixture)</title>
<style>
  body { font: 13px/1.5 system-ui, sans-serif; background:#11151f; color:#dfe5f0; margin:0; padding:24px; }
  h1 { font-size:16px; margin:0 0 4px; }
  p.sub { color:#8b94a8; margin:0 0 18px; font-size:12px; }
  table { border-collapse:collapse; width:100%; max-width:820px; background:#171c28; }
  th, td { padding:7px 10px; border-bottom:1px solid #232a3a; text-align:left; font-variant-numeric:tabular-nums; }
  th { background:#1d2432; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#8b94a8; }
  .done { color:#37d39b; } .rej { color:#ff6b6b; }
  button { margin-top:16px; font:inherit; padding:8px 14px; border-radius:8px;
           background:#263048; color:#dfe5f0; border:1px solid #3a4763; cursor:pointer; margin-right:8px; }
  button:hover { background:#31405f; }
  .target { padding:14px; background:#171c28; border:1px dashed #3a4763; border-radius:10px; margin-top:20px; max-width:420px; }
</style>
</head>
<body>
  <h1>Fake Broker — Order Book</h1>
  <p class="sub">Test fixture for Trade Lock. Not a real broker; nothing here places orders.</p>

  <table id="orderbook">
    <thead>
      <tr><th>Time</th><th>Instrument</th><th>Type</th><th>Quantity</th><th>Price</th><th>Status</th></tr>
    </thead>
    <tbody id="rows">
      <tr><td>09:31:12</td><td>RELIANCE</td><td>BUY</td><td>75</td><td>2,450.10</td><td class="done">COMPLETE</td></tr>
      <tr><td>09:48:03</td><td>TATASTEEL</td><td>SELL</td><td>500</td><td>145.25</td><td class="done">COMPLETE</td></tr>
      <tr><td>10:02:55</td><td>INFY</td><td>BUY</td><td>100</td><td>1,812.00</td><td class="rej">REJECTED</td></tr>
    </tbody>
  </table>

  <div>
    <button id="addFill">Add a COMPLETE fill</button>
    <button id="clear">Clear the book</button>
  </div>

  <div class="target">
    <b>Click target</b><br>
    <span id="clickCount" style="color:#8b94a8">clicks reached the page: 0</span>
  </div>

<script>
  var n = 2;
  var clicks = 0;
  var el = document.getElementById('clickCount');

  // Lets the e2e test prove the tamper-reload actually happened.
  try {
    var c = Number(localStorage.getItem('tl-test-reloads') || '0') + 1;
    localStorage.setItem('tl-test-reloads', String(c));
  } catch (e) {}

  document.addEventListener('click', function (e) {
    if (e.target && (e.target.id === 'addFill' || e.target.id === 'clear')) return;
    clicks++;
    el.textContent = 'clicks reached the page: ' + clicks;
    el.style.color = '#ffb020';
  }, true);

  document.getElementById('addFill').addEventListener('click', function () {
    n++;
    var tr = document.createElement('tr');
    var t = new Date().toTimeString().slice(0, 8);
    tr.innerHTML = '<td>' + t + '</td><td>SBIN-' + n + '</td><td>BUY</td><td>100</td>' +
                   '<td>812.35</td><td class="done">COMPLETE</td>';
    document.getElementById('rows').appendChild(tr);
  });

  document.getElementById('clear').addEventListener('click', function () {
    document.getElementById('rows').innerHTML = '';
  });
</script>
</body>
</html>
